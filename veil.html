<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil Chat</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 500px;
    margin: auto;
    padding: 15px;
  }

  h1 {
    text-align: center;
    color: #f54291;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 8px #f54291;
  }

  #chat {
    background: #1a1a1a;
    padding: 10px;
    border-radius: 10px;
    height: 400px;
    overflow-y: scroll;
    margin-bottom: 10px;
    box-shadow: 0 0 10px #f5429133 inset;
  }

  .message {
    margin: 8px 0;
    padding: 6px 10px;
    background: #2a2a2a;
    border-radius: 8px;
    box-shadow: 0 0 6px #f5429144;
    animation: fadeIn 0.4s;
  }

  .message img {
    max-width: 100%;
    margin-top: 5px;
    border-radius: 5px;
    box-shadow: 0 0 6px #f5429144;
  }

  input, button {
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px;
    border: none;
    outline: none;
  }

  input[type="text"] {
    width: 45%;
    background: #222;
    color: #eee;
    box-shadow: 0 0 4px #f5429133 inset;
  }

  input[type="file"] {
    width: 45%;
    color: #eee;
  }

  button {
    width: 100%;
    background: #f54291;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 6px #f5429166;
    transition: 0.2s;
  }

  button:hover {
    box-shadow: 0 0 12px #f54291cc;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(5px);}
    to {opacity: 1; transform: translateY(0);}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Veil</h1>
  <div id="chat"></div>
  <input type="text" id="nickname" placeholder="Your nickname">
  <input type="text" id="message" placeholder="Your message">
  <input type="file" id="image">
  <button id="postBtn">Post</button>
</div>

<script type="module">
  // 🔹 Set your chat password here
  const CHAT_PASSWORD = "obsidian@26"; // change this to whatever password you want

  // 🔹 Prompt for password before loading chat
  let enteredPassword = prompt("Enter the Veil chat password:");
  if (enteredPassword !== CHAT_PASSWORD) {
    alert("Wrong password! Access denied.");
    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>Access Denied</h2>";
    throw new Error("Access denied"); // stops the rest of the script
  }

  // 🔹 Firebase imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

  // 🔹 Veil Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBlxMde2xAqNH_bymy4ri_j0n3olwo6R08",
    authDomain: "veil-f858b.firebaseapp.com",
    projectId: "veil-f858b",
    storageBucket: "veil-f858b.firebasestorage.app",
    messagingSenderId: "454679639790",
    appId: "1:454679639790:web:21c00eb2e6500fadffe5ff"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  const chatDiv = document.getElementById('chat');
  const postBtn = document.getElementById('postBtn');

  async function postMessage() {
    const nickname = document.getElementById('nickname').value || "Anon";
    const message = document.getElementById('message').value;
    const imageFile = document.getElementById('image').files[0];

    let imageUrl = null;
    if(imageFile){
      const imageRef = ref(storage, 'chatImages/' + Date.now() + '_' + imageFile.name);
      await uploadBytes(imageRef, imageFile);
      imageUrl = await getDownloadURL(imageRef);
    }

    await addDoc(collection(db, "messages"), {
      nickname: nickname,
      message: message,
      image: imageUrl,
      timestamp: serverTimestamp()
    });

    document.getElementById('message').value = "";
    document.getElementById('image').value = "";
  }

  postBtn.addEventListener('click', postMessage);

  const q = query(collection(db, "messages"), orderBy("timestamp"));
  onSnapshot(q, (snapshot) => {
    chatDiv.innerHTML = "";
    snapshot.forEach(doc => {
      const msg = doc.data();
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');
      msgDiv.innerHTML = `<strong>${msg.nickname}:</strong> ${msg.message || ''}`;
      if(msg.image){
        const img = document.createElement('img');
        img.src = msg.image;
        msgDiv.appendChild(img);
      }
      chatDiv.appendChild(msgDiv);
    });
    chatDiv.scrollTop = chatDiv.scrollHeight;
  });
</script>
</body>
</html>
